<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">FreqUI Ultimate</title>
  <desc id="d">The FreqUI Ultimate orange robot mascot stands in front of a multi-bot Freqtrade dashboard with bot cards, a cumulative profit chart and a bot comparison panel.</desc>
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .eye { animation: blink 5s infinite; transform-box: fill-box; transform-origin: center; }
      .antenna { animation: sway 4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
      .bulb { animation: bulb 2.4s ease-in-out infinite; }
      .live { animation: pulse 1.6s ease-in-out infinite; }
      .draw { stroke-dasharray: 520; animation: draw 7s ease-in-out infinite; }
      .grow { animation: grow 7s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
      .grow2 { animation-delay: -0.4s; }
      .grow3 { animation-delay: -0.8s; }
      .logline { animation: fade 3s ease-in-out infinite; }
      @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 93% { transform: scaleY(0.12); } }
      @keyframes sway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
      @keyframes bulb { 0%, 100% { fill: #F7901E; } 50% { fill: #FFB559; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      @keyframes draw { 0% { stroke-dashoffset: 520; } 35%, 100% { stroke-dashoffset: 0; } }
      @keyframes grow { 0% { transform: scaleX(0.15); } 30%, 100% { transform: scaleX(1); } }
      @keyframes fade { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.8; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.6" fill="#0B2545" opacity="0.10"/>
    </pattern>
    <linearGradient id="upfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FB68B" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3FB68B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="downfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5534B" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E5534B" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="640" rx="28"/></clipPath>
    <!-- Mascot, drawn on the 400 x 400 grid of docs/assets/logo_frequi_ultimate.jpg -->
    <g id="robot" stroke="#0B2545" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
      <g class="antenna">
        <line x1="200" y1="66" x2="200" y2="108" fill="none"/>
        <circle class="bulb" cx="200" cy="44" r="21" fill="#F7901E"/>
      </g>
      <path d="M126 300 C96 284 64 296 55 332 C50 352 48 376 48 404 L126 404 Z" fill="#F7901E"/>
      <path d="M274 300 C304 284 336 296 345 332 C350 352 352 376 352 404 L274 404 Z" fill="#F7901E"/>
      <path d="M54 346 C76 340 98 336 120 336 M346 346 C324 340 302 336 280 336" fill="none"/>
      <path d="M120 404 L120 314 C120 292 152 278 200 278 C248 278 280 292 280 314 L280 404 Z" fill="#F7901E"/>
      <ellipse cx="86" cy="200" rx="27" ry="37" fill="#F7901E"/>
      <ellipse cx="314" cy="200" rx="27" ry="37" fill="#F7901E"/>
      <path d="M200 102 C278 102 316 142 316 192 C316 248 272 282 200 282 C128 282 84 248 84 192 C84 142 122 102 200 102 Z" fill="#F7901E"/>
      <rect x="112" y="142" width="176" height="96" rx="48" fill="#0B2545"/>
      <ellipse class="eye" cx="158" cy="194" rx="12" ry="18" fill="#FDF1DC" stroke="none"/>
      <ellipse class="eye" cx="242" cy="194" rx="12" ry="18" fill="#FDF1DC" stroke="none"/>
    </g>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="640" fill="#5BC0CB"/>
    <rect width="1280" height="640" fill="url(#dots)"/>

    <!-- Left: title -->
    <g class="sans" fill="#0B2545">
      <text x="72" y="148" class="mono" font-size="18" letter-spacing="3" font-weight="700">FREQTRADE · MULTI-BOT DASHBOARD</text>
      <text x="66" y="252" font-size="104" font-weight="800" letter-spacing="-3">FreqUI</text>
      <rect x="74" y="276" width="254" height="66" rx="14"/>
      <text x="96" y="324" font-size="46" font-weight="800" fill="#F7901E" letter-spacing="-0.5">Ultimate</text>
      <text x="72" y="400" font-size="27">The multi-bot Freqtrade dashboard,</text>
      <text x="72" y="436" font-size="27">redesigned for production-grade</text>
      <text x="72" y="472" font-size="27">algorithmic trading.</text>
    </g>

    <!-- Left: chips -->
    <g class="mono" font-size="17" fill="#FDF1DC">
      <rect x="72" y="508" width="172" height="40" rx="20" fill="#0B2545"/>
      <text x="158" y="533" text-anchor="middle"><tspan fill="#F7901E" font-weight="700">13</tspan> alert types</text>
      <rect x="256" y="508" width="152" height="40" rx="20" fill="#0B2545"/>
      <text x="332" y="533" text-anchor="middle"><tspan fill="#F7901E" font-weight="700">6</tspan> languages</text>
      <rect x="420" y="508" width="96" height="40" rx="20" fill="#0B2545"/>
      <text x="468" y="533" text-anchor="middle">GPLv3</text>
    </g>
    <text x="72" y="594" class="sans" font-size="19" fill="#0B2545" opacity="0.85">Fork of FreqUI · works with any Freqtrade bot</text>

    <!-- Right: dashboard window -->
    <rect x="618" y="70" width="606" height="500" rx="20" fill="#0B2545" opacity="0.18"/>
    <rect x="610" y="60" width="606" height="500" rx="20" fill="#0B2545"/>
    <g>
      <circle cx="638" cy="84" r="6" fill="#E5534B"/>
      <circle cx="658" cy="84" r="6" fill="#F7901E"/>
      <circle cx="678" cy="84" r="6" fill="#3FB68B"/>
      <text x="700" y="90" class="mono" font-size="16" fill="#FDF1DC" opacity="0.7">FreqUI Ultimate · fleet</text>
      <rect x="1124" y="72" width="76" height="26" rx="13" fill="#133A63"/>
      <circle class="live" cx="1142" cy="85" r="5" fill="#3FB68B"/>
      <text x="1154" y="91" class="mono" font-size="15" font-weight="700" fill="#3FB68B">LIVE</text>
      <line x1="610" y1="108" x2="1216" y2="108" stroke="#133A63" stroke-width="2"/>
    </g>

    <!-- Bot cards -->
    <g class="mono" font-size="16">
      <g transform="translate(630 124)">
        <rect width="180" height="104" rx="12" fill="#133A63"/>
        <circle cx="18" cy="23" r="5" fill="#3FB68B"/>
        <text x="32" y="29" fill="#FDF1DC">Bot 1</text>
        <path d="M150 30 l8 -12 l8 12 z" fill="#3FB68B"/>
        <path d="M16 90 L16 82 L36 76 L56 79 L76 68 L96 72 L116 60 L136 64 L164 50 L164 90 Z" fill="url(#upfill)"/>
        <polyline points="16,82 36,76 56,79 76,68 96,72 116,60 136,64 164,50" fill="none" stroke="#3FB68B" stroke-width="3" stroke-linejoin="round"/>
      </g>
      <g transform="translate(826 124)">
        <rect width="180" height="104" rx="12" fill="#133A63"/>
        <circle cx="18" cy="23" r="5" fill="#3FB68B"/>
        <text x="32" y="29" fill="#FDF1DC">Bot 2</text>
        <path d="M150 18 l8 12 l8 -12 z" fill="#E5534B"/>
        <path d="M16 90 L16 54 L36 60 L56 56 L76 68 L96 66 L116 76 L136 74 L164 84 L164 90 Z" fill="url(#downfill)"/>
        <polyline points="16,54 36,60 56,56 76,68 96,66 116,76 136,74 164,84" fill="none" stroke="#E5534B" stroke-width="3" stroke-linejoin="round"/>
      </g>
      <g transform="translate(1022 124)">
        <rect width="180" height="104" rx="12" fill="#133A63"/>
        <circle cx="18" cy="23" r="5" fill="#F7901E"/>
        <text x="32" y="29" fill="#FDF1DC">Bot 3</text>
        <path d="M150 30 l8 -12 l8 12 z" fill="#3FB68B"/>
        <path d="M16 90 L16 76 L36 72 L56 78 L76 66 L96 70 L116 62 L136 66 L164 56 L164 90 Z" fill="url(#upfill)"/>
        <polyline points="16,76 36,72 56,78 76,66 96,70 116,62 136,66 164,56" fill="none" stroke="#3FB68B" stroke-width="3" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Log console, mostly behind the robot -->
    <g>
      <rect x="630" y="246" width="230" height="294" rx="12" fill="#133A63"/>
      <g fill="#5BC0CB">
        <rect class="logline" x="648" y="268" width="150" height="8" rx="4"/>
        <rect class="logline" x="648" y="288" width="110" height="8" rx="4" style="animation-delay:-0.6s"/>
        <rect class="logline" x="648" y="308" width="170" height="8" rx="4" style="animation-delay:-1.2s"/>
      </g>
    </g>

    <!-- Cumulative profit vs BTC -->
    <g>
      <rect x="876" y="246" width="326" height="146" rx="12" fill="#133A63"/>
      <text x="894" y="274" class="sans" font-size="16" font-weight="600" fill="#FDF1DC">Cumulative profit vs BTC</text>
      <line x1="894" y1="372" x2="1186" y2="372" stroke="#FDF1DC" stroke-opacity="0.15" stroke-width="2"/>
      <polyline points="894,360 930,352 966,356 1002,334 1038,340 1074,318 1110,322 1146,300 1186,290" fill="none" stroke="#5BC0CB" stroke-width="3" stroke-dasharray="6 6" opacity="0.8"/>
      <polyline class="draw" points="894,364 930,346 966,350 1002,322 1038,326 1074,304 1110,308 1146,292 1186,274" fill="none" stroke="#3FB68B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="1186" y="364" class="mono" font-size="14" fill="#5BC0CB" text-anchor="end">BTC</text>
    </g>

    <!-- Bot comparison -->
    <g class="mono" font-size="15" fill="#FDF1DC">
      <rect x="876" y="406" width="326" height="134" rx="12" fill="#133A63"/>
      <text x="894" y="434" class="sans" font-size="16" font-weight="600">Bot comparison</text>
      <text x="894" y="465">Bot 1</text>
      <rect class="grow" x="954" y="453" width="210" height="14" rx="7" fill="#3FB68B"/>
      <text x="894" y="493">Bot 3</text>
      <rect class="grow grow2" x="954" y="481" width="140" height="14" rx="7" fill="#3FB68B"/>
      <text x="894" y="521">Bot 2</text>
      <rect class="grow grow3" x="954" y="509" width="62" height="14" rx="7" fill="#E5534B"/>
    </g>

    <!-- Mascot in front of the dashboard -->
    <use href="#robot" transform="translate(556 322) scale(0.8)"/>
  </g>
</svg>
