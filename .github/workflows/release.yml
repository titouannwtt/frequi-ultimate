name: Release

# Push a tag vX.Y.Z (the same X.Y.Z as package.json and gateway/Cargo.toml).
#
# The release is created as a PRERELEASE: `freqtrade install-ui` without --ui-version skips
# prereleases, so nobody receives it before it has been checked. Promote it by hand:
#   gh release edit vX.Y.Z --prerelease=false
#
# GitHub lists the assets of a release by name, not by upload order. freqtrade-ultimate's
# `install-ui` picks the `frequi-ultimate-ui-*` archive by name (older versions took assets[0],
# which may then be a gateway binary: tell those users to pass the archive by hand).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, for example v2.0.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  preflight:
    name: versions agree with the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Check tag, package.json and gateway version
        run: |
          set -euo pipefail
          version=${TAG#v}
          pkg=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json | head -n1)
          gw=$(sed -n 's/^version = "\(.*\)"$/\1/p' gateway/Cargo.toml | head -n1)
          echo "tag $TAG, package.json $pkg, gateway $gw"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::tag must look like v1.2.3"; exit 1; }
          [ "$pkg" = "$version" ] || { echo "::error::package.json is $pkg, the tag says $version"; exit 1; }
          [ "$gw" = "$version" ] || { echo "::error::gateway/Cargo.toml is $gw, the tag says $version"; exit 1; }

  ui:
    name: UI archive
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --maxWorkers=4
      - run: pnpm run build
      - name: Archives
        run: |
          set -euo pipefail
          mkdir -p release
          # Same bytes for the same commit: file times come from the commit, the entries are
          # sorted, no extra attributes, UTC for the DOS time of the zip format.
          export TZ=UTC
          epoch=$(git log -1 --format=%ct)
          find dist -exec touch -h -d "@$epoch" {} +
          # `freqtrade install-ui` unzips into ui/installed: index.html must be at the root of
          # the archive, and the source maps (60 MB) stay out of it.
          (cd dist && find . -type f ! -name '*.map' | LC_ALL=C sort | zip -qX@ "../release/frequi-ultimate-ui-$TAG.zip")
          (cd dist && find . -type f -name '*.map' | LC_ALL=C sort | zip -qX@ "../release/frequi-ultimate-sourcemaps-$TAG.zip")
          unzip -l "release/frequi-ultimate-ui-$TAG.zip" | grep -E ' index\.html$'
          ls -l release
      - uses: actions/upload-artifact@v4
        with:
          name: ui
          path: release
          retention-days: 7

  gateway:
    name: gateway ${{ matrix.target }}
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: build
        uses: ./.github/actions/build-gateway
        with:
          target: ${{ matrix.target }}
          name: frequi-gateway-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-${{ matrix.target }}
          path: ${{ steps.build.outputs.path }}
          retention-days: 7

  publish:
    name: publish (prerelease)
    needs: [ui, gateway]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums and notes
        run: |
          set -euo pipefail
          mkdir -p out
          cp artifacts/ui/* artifacts/gateway-*/* out/
          (cd out && sha256sum frequi-* > SHA256SUMS && cat SHA256SUMS)
          scripts/release-notes.sh "$TAG" > notes.md
      - name: Create the prerelease with the UI archive alone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A rebuild of a tag that already has a release (workflow_dispatch): `gh release create`
            # would be refused. Keep the release as it is (title, notes, prerelease flag, which may
            # have been promoted by hand), drop its assets and upload them again in the order
            # below, so that the UI archive is still assets[0].
            echo "release $TAG exists: replacing its assets, nothing else"
            gh release view "$TAG" --json isPrerelease --jq '"prerelease: \(.isPrerelease)"'
            gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
              gh release delete-asset "$TAG" "$name" --yes
            done
            gh release upload "$TAG" "out/frequi-ultimate-ui-$TAG.zip" --clobber
          else
            # The release name is the tag: `install-ui --ui-version vX.Y.Z` matches on it.
            gh release create "$TAG" "out/frequi-ultimate-ui-$TAG.zip" \
              --verify-tag --prerelease --title "$TAG" --notes-file notes.md
          fi
      - name: Upload the rest, in order
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for f in \
            "out/frequi-gateway-x86_64-unknown-linux-musl" \
            "out/frequi-gateway-aarch64-unknown-linux-musl" \
            "out/frequi-ultimate-sourcemaps-$TAG.zip" \
            "out/SHA256SUMS"; do
            gh release upload "$TAG" "$f" --clobber
          done
      - name: The UI archive is attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[].name' \
            | grep -qx "frequi-ultimate-ui-$TAG.zip"
