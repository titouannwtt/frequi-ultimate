[workspace]
resolver = "3"
members = [
    "crates/fg-core",
    "crates/fg-sources",
    "crates/fg-engine",
    "crates/fg-server",
    "bin/frequi-gateway",
    "tools/fakebot",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/titouannwtt/frequi-ultimate"
publish = false

# Versions are pinned exactly (see 03 section 2.2 for the reasons behind each choice).
# The whole set below was resolved together once (no conflict); members only pull in what they
# use, so Cargo.lock grows as the later lots (fg-sources, fg-engine, fg-server) start using them.
[workspace.dependencies]
fg-core = { path = "crates/fg-core" }
fg-sources = { path = "crates/fg-sources" }
fg-engine = { path = "crates/fg-engine" }
fg-server = { path = "crates/fg-server" }

tokio = { version = "=1.53.3", features = ["rt-multi-thread", "net", "time", "signal", "fs", "macros", "sync", "io-util"] }
axum = { version = "=0.8.9", features = ["ws", "macros"] }
tower-http = { version = "=0.7.1", features = ["cors", "compression-gzip", "compression-br", "timeout", "limit", "trace", "set-header"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "gzip"] }
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "hooks"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
figment = { version = "=0.10.19", features = ["toml", "env"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json", "env-filter"] }
arc-swap = "=1.9.2"
governor = "=0.10.4"
argon2 = "=0.6.0"
chacha20poly1305 = "=0.11.0"
zeroize = "=1.9.1"
getrandom = "=0.4.3"
blake3 = "=1.8.7"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "=0.10.4"
ts-rs = { version = "=12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
clap = { version = "=4.6.7", features = ["derive"] }
thiserror = "=2.0.21"
anyhow = "=1.0.104"
mimalloc = "=0.1.52"
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
tempfile = "=3.27.0"
# Historical candles are read from the feather files (Arrow IPC, lz4 frames) of the ftcache daemon
# and of the freqtrade data directory. Only the IPC reader and its array types: no compute, no
# cast, no csv/json, no zstd.
arrow-array = { version = "=60.0.0", default-features = false }
arrow-ipc = { version = "=60.0.0", default-features = false, features = ["lz4"] }
arrow-schema = { version = "=60.0.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Password hashing is deliberately slow; at opt-level 0 the tests would spend seconds on it.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
