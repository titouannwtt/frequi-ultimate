[package]
name = "fakebot"
description = "Fake freqtrade bots (REST + WebSocket + SQLite ledger) and a fake ftcache daemon for load and end-to-end tests of frequi-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "fakebot"

[[bin]]
name = "fakebot"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std"] }

[dev-dependencies]
mimalloc = { workspace = true }
fg-core = { workspace = true }
fg-engine = { workspace = true }
fg-server = { workspace = true }
fg-sources = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["test-util", "process"] }

[lints]
workspace = true
